schema: spec-driven

context: |
  Define the next useful working increment, not the imagined final system.
  Every behavior-changing increment needs an Outcome, technically enforced
  Operating Envelope, Non-Goals, Non-Deferrable Invariants, Observable Proof,
  Material Residual Risks, and Stop Line. Resolve only decisions that can change
  the current increment or a protected boundary. Keep unreachable future behavior
  outside current acceptance. Ordinary Small uses main-owned runtime proof and
  focused validation; Material behavior uses fresh critical-only SDET after proof
  and accepted-scope completion. Minimize time-to-first-real-signal for every
  behavior dependency chain without bypassing owner authorization, safety,
  restoration, cleanup, or live-attempt gates. Edits alone never complete a task.

rules:
  proposal:
    - Include an Outcome Capsule with all seven current-increment fields from project context.
    - State user value and why this bounded increment is needed now.
    - List exact new and modified capabilities; do not hide behavior changes as implementation detail.
  design:
    - Resolve only current-increment architecture, ownership, failure boundaries, and protected decisions.
    - Record alternatives and why a simpler remove, narrow, reuse, or local-guard option is insufficient.
    - Keep future scale, variants, and compatibility out of the current design unless reachable in the enforced envelope.
    - Define the current fidelity rung, next real boundary, and exact authorization, safeguards, restoration, cleanup, and evidence needed to reach it.
  specs:
    - Give every current-increment requirement at least one observable acceptance scenario.
    - Do not use TBD, as appropriate, handle errors, or another vague placeholder in actionable requirements.
    - Keep non-applicable and future behavior explicit rather than silently omitting or requiring it.
  tasks:
    - Group work by meaningful behavior, evidence, or gate outcome rather than one checkbox per file.
    - Put the smallest complete happy path and observable runtime proof before broad testing or optional review.
    - Put the earliest safely reachable real check before dependent behavior; if deferred, name the exact blocker, earliest unblocking task, and dependency-chain stop condition.
    - State the exact observable proof and applicable focused validation for each behavior task; keep it unchecked until both pass.
    - Put admitted session-derived improvements under `## Session-Derived Improvements` and state Trigger/Evidence, Why, Prerequisites, Scope/Non-Goals, Implementation, Observable Proof, Validation, and any exact Owner Blocker.
    - Material test artifacts belong to a fresh test-only SDET after current proof and accepted-scope completion.
    - For each newly authored change, append exactly one unchecked initially-last task that waits for every other known task, analyzes complete `history.md` through the existing compaction improvement matrix/admission/task contract, immediately executes admitted improvements or records `none`, and never schedules another final-history analysis.
